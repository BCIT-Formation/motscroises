version: 2
updates:
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 08:00
    timezone: Europe/Paris
  open-pull-requests-limit: 5
  labels:
  - dependencies
  commit-message:
    prefix: chore
    include: scope
  groups:
    next-react:
      patterns:
      - next
      - react
      - react-dom
    dev-tools:
      patterns:
      - eslint*
    minor-and-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 08:00
    timezone: Europe/Paris
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - github-actions
  commit-message:
    prefix: ci
    include: scope
  groups:
    github-actions:
      patterns:
      - '*'
